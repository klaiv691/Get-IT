<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case studies · Get-IT</title>
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div class="masthead">
  <div class="wrap row">
    <img class="mark" src="assets/logo-icon.png" alt="Get-IT">
    <div class="masthead-titles">
      <h2>Get-IT</h2>
      <p>Twesige Marvin Clive · Enterprise IT, Cloud &amp; Cybersecurity Services</p>
    </div>
  </div>
</div>
<div class="hairline"></div>
<div class="hero">
  <div class="wrap hero-inner">
    <div>
      <p class="kicker">Case Studies</p>
      <h1>Project portfolio</h1>
      <p class="sub">Selected inspections, repairs, and builds — shared by request.</p>
    </div>
    <div class="count" id="count">Loading…</div>
  </div>
</div>
<main class="wrap">
  <div id="list" class="loading"><div class="spinner"></div>Loading entries...</div>
  <div class="footnote">Selected work, shared by request. · <a href="admin.html" class="admin-link">Admin login</a></div>
</main>

<script>
async function load(){
  const { data, error } = await sb
    .from('projects')
    .select('*')
    .eq('published', true)
    .order('date', { ascending: false });

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');

  if(error){
    listEl.innerHTML = `<div class="empty">Couldn't load entries. Check the Supabase URL and key are correct.</div>`;
    countEl.textContent = '';
    console.error(error);
    return;
  }

  countEl.textContent = `${data.length} ${data.length===1?'entry':'entries'}`;

  if(data.length === 0){
    listEl.innerHTML = `<div class="empty">No entries published yet.</div>`;
    return;
  }

  listEl.innerHTML = `<div class="grid">${data.map((e, i) => `
    <div class="ticket ${catClass(e.category)}" style="--i:${i}">
      ${e.featured_image ? `<img class="ticket-image" src="${storageUrl(e.featured_image)}" alt="">` : ''}
      <div class="ticket-head">
        <span class="no">${ticketNo(e.ticket_no)}</span>
        <span>${fmtDate(e.date)}</span>
      </div>
      <div class="ticket-body">
        <span class="cat-badge ${catClass(e.category)}">${escapeHtml(e.category)}</span>
        <h3 style="margin-top:8px;">${escapeHtml(e.title)}</h3>
        ${e.problem ? `<p>${escapeHtml(e.problem)}</p>` : ''}
        ${e.outcome ? `<div class="outcome"><b>Outcome</b>${escapeHtml(e.outcome)}</div>` : ''}
        ${(e.tags && e.tags.length) ? `<div class="tags">${e.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      </div>
    </div>
  `).join('')}</div>`;
}

load();
</script>
</body>
</html>
